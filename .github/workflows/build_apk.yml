name: Build Block Drop Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_release_bundle:
        description: 'Build Google Play App Bundle (.aab)'
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Environment & Secrets
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Prepare Keystores for Signing
        run: |
          # 1. Prepare Debug Keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Prepare Release Keystore (Fallback self-signed for CI builds if not provided via secrets)
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Generating self-signed release keystore for CI artifact..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=BlockDrop,O=Studio,C=US"
          else
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Run Automated Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB (Google Play Bundle)
        if: ${{ github.event.inputs.build_release_bundle != 'false' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockDrop-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockDrop-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release AAB Artifact (Google Play)
        if: ${{ github.event.inputs.build_release_bundle != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: BlockDrop-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish to GitHub Releases (Downloadable on Repo Front Page)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          name: "Block Drop v1.0 — Download APK"
          body: |
            ### 🎮 Block Drop — Android APK Download
            Download and install the game directly on your Android phone or tablet:
            - **[app-debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0/app-debug.apk)** (Direct installation for any Android device)
            - **[app-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0/app-release.apk)** (Signed production APK)
            - **[app-release.aab](https://github.com/${{ github.repository }}/releases/download/v1.0/app-release.aab)** (Google Play Store bundle)
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
